server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend web service (separate Render deployment)
    location /api/ {
        # No URI part after the host: nginx forwards the original
        # /api/... request path unchanged to the backend.
        proxy_pass https://shopsphere-api-h29l.onrender.com;
        # Upstream hostname (not the frontend's Host) so Render can route it.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Send the proxy_pass hostname as TLS SNI when connecting upstream.
        proxy_ssl_server_name on;
    }
}