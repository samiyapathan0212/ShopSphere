# Test-only configuration.
#
# The backend deliberately has NO default JWT secret in src/main/resources:
# JWT_SECRET must come from the environment and startup fails without it. Test
# slices load application.yml, so an unresolved ${JWT_SECRET} would otherwise be
# bound literally and fail to decode. This supplies a throwaway value for tests
# only - it is not a secret and is never used outside the test classpath.
app.jwt.secret=ZGV2LW9ubHktc2hvcHNwaGVyZS1qd3Qtc2VjcmV0LWtleS1wbGFjZWhvbGRlci0wMTIzNDU2Nzg5YWJjZGVm
app.jwt.expiration-ms=900000