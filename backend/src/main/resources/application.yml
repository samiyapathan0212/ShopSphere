spring:
  application:
    name: shopsphere-backend

  # --- PostgreSQL (via environment variables) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere}

  # --- JPA / Hibernate ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # --- Flyway database migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Redis cache (via environment variables) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

# --- Server ---
server:
  port: ${SERVER_PORT:8080}

# --- JWT (via environment variables) ---
app:
  jwt:
    # Development-only placeholder secret (base64-encoded). NEVER use in
    # production: set JWT_SECRET to a strong random base64 value (e.g.
    # `openssl rand -base64 64`) in your environment instead.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2hvcHNwaGVyZS1qd3Qtc2VjcmV0LWtleS1wbGFjZWhvbGRlci0wMTIzNDU2Nzg5YWJjZGVm}
    # Access token lifetime in milliseconds (15 minutes by default).
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

# --- Springdoc OpenAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html